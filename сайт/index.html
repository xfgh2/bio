<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>xfgh2 • bio</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            color: #ffffff;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            
            /* Фон - ночной город */
            background: url('bg.jpg') no-repeat center center/cover;
            background-color: #0f1015; 
            perspective: 1000px;
        }

        /* Холст для дождя */
        #rainCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        /* Карточка */
        .glass-card {
            position: relative;
            z-index: 2;
            width: 850px;
            max-width: 95%;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.03) 0%, rgba(255, 255, 255, 0.005) 100%);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-top: 1px solid rgba(255, 255, 255, 0.25);
            border-left: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 28px;
            padding: 40px;
            display: flex;
            gap: 40px;
            box-shadow: 
                0 25px 45px rgba(0, 0, 0, 0.2), 
                inset 0 0 15px rgba(255, 255, 255, 0.02);
            
            /* Плавный возврат в исходное положение */
            transition: all 0.4s cubic-bezier(0.25, 0.8, 0.25, 1);
            transform-style: preserve-3d;
            will-change: transform;
        }

        .glass-card:hover {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.06) 0%, rgba(255, 255, 255, 0.01) 100%);
            border-top: 1px solid rgba(255, 255, 255, 0.45);
            border-left: 1px solid rgba(255, 255, 255, 0.35);
            box-shadow: 
                0 35px 60px rgba(0, 0, 0, 0.4), 
                inset 0 0 25px rgba(255, 255, 255, 0.08);
        }

        /* Левая панель */
        .left-panel {
            width: 260px;
            display: flex;
            flex-direction: column;
            gap: 18px;
            transform: translateZ(20px); /* Небольшой 3D вынос вперед */
        }

        /* Контейнер аватарки */
        .avatar {
            width: 100%;
            height: 260px;
            border-radius: 20px;
            background: rgba(0, 0, 0, 0.3);
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.15);
            position: relative;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.4);
        }

        .avatar::after {
            content: '';
            position: absolute;
            top: 0; left: -100%;
            width: 50%; height: 100%;
            background: linear-gradient(to right, rgba(255,255,255,0) 0%, rgba(255,255,255,0.15) 50%, rgba(255,255,255,0) 100%);
            transform: skewX(-25deg);
            animation: shine 6s infinite;
        }

        @keyframes shine {
            0% { left: -100%; }
            20% { left: 200%; }
            100% { left: 200%; }
        }

        .avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .avatar:hover img {
            transform: scale(1.08);
        }

        /* Терминал */
        .terminal {
            background: rgba(0, 0, 0, 0.5);
            border-radius: 12px;
            padding: 14px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.75rem;
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: inset 0 2px 10px rgba(0, 0, 0, 0.2);
            backdrop-filter: blur(10px);
        }

        .term-header {
            display: flex;
            justify-content: space-between;
            color: #888;
            margin-bottom: 12px;
            font-weight: 500;
        }

        .term-body {
            color: #4ade80;
            text-shadow: 0 0 5px rgba(74, 222, 128, 0.3);
        }

        /* Соцсети */
        .social {
            display: flex;
            gap: 20px;
            margin-top: 5px;
            justify-content: center;
        }

        .social a {
            color: #fff;
            text-decoration: none;
            font-size: 0.95rem;
            display: flex;
            align-items: center;
            gap: 8px;
            opacity: 0.7;
            transition: all 0.3s ease;
            font-weight: 500;
        }

        .social a:hover {
            opacity: 1;
            transform: translateY(-2px);
            text-shadow: 0 0 10px rgba(255,255,255,0.5);
        }

        /* Правая панель */
        .right-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            transform: translateZ(25px); /* Текст парит чуть выше аватарки */
        }

        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin-bottom: 8px;
        }

        .name-wrapper h1 {
            font-size: 2.2rem;
            font-weight: 700;
            display: inline-block;
            letter-spacing: -0.5px;
            text-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
        }

        .name-wrapper span {
            font-size: 1.1rem;
            color: #999;
            font-weight: 400;
            margin-left: 8px;
        }

        .company-link {
            color: #c0c0c0;
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 500;
            transition: 0.2s;
        }
        
        .company-link:hover {
            color: #fff;
        }

        .bio {
            color: #b3b3b3;
            font-size: 1rem;
            margin-bottom: 40px;
            line-height: 1.5;
        }

        .grid-content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 35px;
            flex: 1;
        }

        .section-title {
            font-size: 0.75rem;
            color: #999;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-bottom: 18px;
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 600;
        }

        /* Навыки */
        .skills-list {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
        }

        .skills-list span {
            font-size: 0.9rem;
            font-weight: 600;
            color: #e0e0e0;
            background: rgba(255, 255, 255, 0.05);
            padding: 8px 16px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(5px);
            transition: 0.3s;
            cursor: default;
        }

        .skills-list span:hover {
            background: rgba(255, 255, 255, 0.15);
            border-color: rgba(255, 255, 255, 0.4);
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        /* Плеер */
        .player-controls {
            display: flex;
            align-items: center;
            gap: 25px;
            margin-bottom: 20px;
            color: #d0d0d0;
        }

        .player-controls i {
            cursor: pointer;
            transition: all 0.2s;
            font-size: 1.15rem;
        }

        .player-controls i:hover {
            color: #fff;
            transform: scale(1.1);
            text-shadow: 0 0 10px rgba(255,255,255,0.4);
        }

        .progress-container {
            width: 100%;
            height: 6px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 3px;
            margin-bottom: 12px;
            position: relative;
            overflow: hidden;
            box-shadow: inset 0 1px 3px rgba(0,0,0,0.3);
        }

        .progress-bar {
            position: absolute;
            top: 0;
            left: 0;
            height: 100%;
            width: 45%; 
            background: #fff;
            border-radius: 3px;
            box-shadow: 0 0 10px rgba(255,255,255,0.6);
        }

        .time {
            font-size: 0.75rem;
            color: #888;
            font-weight: 500;
        }

        .footer {
            margin-top: auto;
            font-size: 0.8rem;
            color: #666;
            font-weight: 500;
        }

        /* Адаптивность для мобилок */
        @media (max-width: 768px) {
            body {
                perspective: none;
            }
            .glass-card {
                flex-direction: column;
                padding: 25px;
                gap: 25px;
                height: 90vh;
                overflow-y: auto;
                border-radius: 20px;
                transform: none !important;
            }
            .left-panel, .right-panel {
                transform: none;
            }
            .left-panel {
                width: 100%;
            }
            .grid-content {
                grid-template-columns: 1fr;
                gap: 30px;
            }
        }
    </style>
</head>
<body>

    <canvas id="rainCanvas"></canvas>

    <div class="glass-card" id="tiltCard">
        <div class="left-panel">
            <div class="avatar">
                <img src="avatar.png" alt="Avatar">
            </div>
            
            <div class="terminal">
                <div class="term-header">
                    <span>host: archbox</span>
                    <span>uptime: 3d</span>
                </div>
                <div class="term-body">
                    <span>$ neofetch --ascii</span>
                </div>
            </div>

            <div class="social">
                <a href="#"><i class="fa-brands fa-github"></i> GitHub</a>
                <a href="#"><i class="fa-brands fa-telegram"></i> Telegram</a>
            </div>
        </div>

        <div class="right-panel">
            <div class="header-top">
                <div class="name-wrapper">
                    <h1>xfgh2</h1><span>• bio</span>
                </div>
                <a href="#" class="company-link">hustle.company</a>
            </div>
            
            <p class="bio">hustle.company, InfoSec enthusiast.</p>

            <div class="grid-content">
                <div class="skills-section">
                    <div class="section-title">
                        <i class="fa-solid fa-code"></i> НАВЫКИ
                    </div>
                    <div class="skills-list">
                        <span>Python</span>
                        <span>C++</span>
                        <span>Infosec</span>
                        <span>Linux</span>
                    </div>
                </div>

                <div class="music-section">
                    <div class="section-title">
                        <i class="fa-solid fa-music"></i> МУЗЫКА
                    </div>
                    <div class="player-controls">
                        <i class="fa-solid fa-backward-step"></i>
                        <i class="fa-solid fa-play"></i>
                        <i class="fa-solid fa-forward-step"></i>
                        <i class="fa-solid fa-repeat"></i>
                    </div>
                    <div class="progress-container">
                        <div class="progress-bar"></div>
                    </div>
                    <div class="time">00:54 / 01:58</div>
                </div>
            </div>

            <div class="footer">
                © 2026 xfgh2 • Все права защищены
            </div>
        </div>
    </div>

    <script>
        // --- 1. ЭФФЕКТ СИЛЬНОГО ДОЖДЯ ---
        const canvas = document.getElementById('rainCanvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        const raindrops = [];
        const dropsCount = 450; // ИЗМЕНЕНО: Было 220, капель стало намного больше

        for (let i = 0; i < dropsCount; i++) {
            raindrops.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                length: Math.random() * 25 + 15,    // ИЗМЕНЕНО: капли стали длиннее
                speed: Math.random() * 12 + 9,      // ИЗМЕНЕНО: скорость падения выше (было 8 + 6)
                opacity: Math.random() * 0.4 + 0.15 // ИЗМЕНЕНО: капли стали капельку заметнее
            });
        }

        function drawRain() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.lineCap = 'round';
            const angle = 0.12; 

            for (let i = 0; i < raindrops.length; i++) {
                const drop = raindrops[i];
                ctx.beginPath();
                ctx.moveTo(drop.x, drop.y);
                ctx.lineTo(drop.x + drop.length * angle, drop.y + drop.length);
                ctx.strokeStyle = `rgba(255, 255, 255, ${drop.opacity})`;
                ctx.lineWidth = 1.2;
                ctx.stroke();

                drop.y += drop.speed;
                drop.x += drop.speed * angle;

                if (drop.y > canvas.height) {
                    drop.y = -drop.length;
                    drop.x = Math.random() * canvas.width;
                }
            }
            requestAnimationFrame(drawRain);
        }

        drawRain();

        // --- 2. УМЕНЬШЕННЫЙ 3D НАКЛОН ---
        const card = document.getElementById('tiltCard');

        if (window.matchMedia("(min-width: 769px)").matches) {
            card.addEventListener('mousemove', (e) => {
                const rect = card.getBoundingClientRect();
                const x = e.clientX - rect.left; 
                const y = e.clientY - rect.top;  
                
                const centerX = rect.width / 2;
                const centerY = rect.height / 2;
                
                // ИЗМЕНЕНО: Поменял множитель с 10 на 4, теперь наклон гораздо мягче
                const rotateX = ((y - centerY) / centerY) * -4; 
                const rotateY = ((x - centerX) / centerX) * 4;
                
                card.style.transition = 'none';
                card.style.transform = `perspective(1000px) rotateX(${rotateX}deg) rotateY(${rotateY}deg) scale(1.01)`;
            });

            card.addEventListener('mouseleave', () => {
                card.style.transition = 'all 0.5s cubic-bezier(0.25, 0.8, 0.25, 1)';
                card.style.transform = `perspective(1000px) rotateX(0deg) rotateY(0deg) scale(1)`;
            });
        }
    </script>
</body>
</html>
