<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>xfgh2 • bio</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            color: #ffffff;
            height: 100vh;
            overflow: hidden;
            background-color: #0f1015; 
        }

        /* Слой с размытым фоном */
        .bg-blur {
            position: absolute;
            top: -30px; left: -30px; right: -30px; bottom: -30px;
            background: url('bg.jpg') no-repeat center center/cover;
            filter: blur(10px); 
            z-index: 0;
        }

        /* Слой с дождем и сакурой */
        #rainCanvas {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 1; 
            pointer-events: none;
        }

        /* Контейнер для центрирования */
        .wrapper {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 2;
            display: flex;
            justify-content: center;
            align-items: center;
            perspective: 1000px;
            overflow-y: auto;
        }

        /* АНИМАЦИЯ RGB ОБВОДКИ */
        @keyframes rgb-border {
            0% { border-color: rgba(255, 0, 0, 0.8); box-shadow: 0 25px 45px rgba(0, 0, 0, 0.2), inset 0 0 15px rgba(255, 0, 0, 0.1); }
            17% { border-color: rgba(255, 255, 0, 0.8); box-shadow: 0 25px 45px rgba(0, 0, 0, 0.2), inset 0 0 15px rgba(255, 255, 0, 0.1); }
            33% { border-color: rgba(0, 255, 0, 0.8); box-shadow: 0 25px 45px rgba(0, 0, 0, 0.2), inset 0 0 15px rgba(0, 255, 0, 0.1); }
            50% { border-color: rgba(0, 255, 255, 0.8); box-shadow: 0 25px 45px rgba(0, 0, 0, 0.2), inset 0 0 15px rgba(0, 255, 255, 0.1); }
            67% { border-color: rgba(0, 0, 255, 0.8); box-shadow: 0 25px 45px rgba(0, 0, 0, 0.2), inset 0 0 15px rgba(0, 0, 255, 0.1); }
            83% { border-color: rgba(255, 0, 255, 0.8); box-shadow: 0 25px 45px rgba(0, 0, 0, 0.2), inset 0 0 15px rgba(255, 0, 255, 0.1); }
            100% { border-color: rgba(255, 0, 0, 0.8); box-shadow: 0 25px 45px rgba(0, 0, 0, 0.2), inset 0 0 15px rgba(255, 0, 0, 0.1); }
        }

        /* Карточка */
        .glass-card {
            position: relative;
            width: 850px;
            max-width: 95%;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.03) 0%, rgba(255, 255, 255, 0.005) 100%);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            
            /* Настройки рамки для RGB */
            border: 2px solid rgba(255, 0, 0, 0.8);
            animation: rgb-border 6s linear infinite; /* Запуск переливания */
            
            border-radius: 28px;
            padding: 40px;
            display: flex;
            gap: 40px;
            transition: all 0.4s cubic-bezier(0.25, 0.8, 0.25, 1);
            transform-style: preserve-3d;
            will-change: transform;
            margin: auto;
        }

        .glass-card:hover:not(.disable-glass-hover) {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.06) 0%, rgba(255, 255, 255, 0.01) 100%);
            /* При наведении усиливаем внутреннее свечение, но сохраняем анимацию рамки */
        }

        /* Левая панель */
        .left-panel {
            width: 320px; 
            display: flex;
            flex-direction: column;
            gap: 18px;
            transform: translateZ(20px);
        }

        .avatar {
            width: 100%;
            height: 240px; 
            border-radius: 20px;
            background: rgba(0, 0, 0, 0.3);
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.15);
            position: relative;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.4);
        }

        .avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .avatar:hover img {
            transform: scale(1.08);
        }

        .terminal {
            background: rgba(0, 0, 0, 0.5);
            border-radius: 12px;
            padding: 14px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.75rem;
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: inset 0 2px 10px rgba(0, 0, 0, 0.2);
            backdrop-filter: blur(10px);
        }

        .term-header {
            display: flex;
            justify-content: space-between;
            color: #888;
            margin-bottom: 12px;
            font-weight: 500;
        }

        .term-body {
            color: #4ade80;
            text-shadow: 0 0 5px rgba(74, 222, 128, 0.3);
        }

        .social {
            display: flex;
            gap: 20px;
            margin-top: 5px;
            justify-content: center;
        }

        .social a {
            color: #fff;
            text-decoration: none;
            font-size: 0.95rem;
            display: flex;
            align-items: center;
            gap: 8px;
            opacity: 0.7;
            transition: all 0.3s ease;
            font-weight: 500;
        }

        .social a:hover {
            opacity: 1;
            transform: translateY(-2px);
            text-shadow: 0 0 10px rgba(255,255,255,0.5);
        }

        /* Правая панель */
        .right-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            transform: translateZ(25px);
        }

        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin-bottom: 30px; 
        }

        .name-wrapper h1 {
            font-size: 2.2rem;
            font-weight: 700;
            display: inline-block;
            letter-spacing: -0.5px;
            text-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
        }

        .name-wrapper span {
            font-size: 1.1rem;
            color: #999;
            font-weight: 400;
            margin-left: 8px;
        }

        .grid-content {
            display: grid;
            grid-template-columns: 1.2fr 0.8fr;
            gap: 35px;
            flex: 1;
        }

        .section-title {
            font-size: 0.75rem;
            color: #ccc; 
            text-transform: uppercase;
            letter-spacing: 1.5px;
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 600;
            text-shadow: 0 1px 3px rgba(0,0,0,0.5);
            margin-bottom: 0;
        }

        .skills-list {
            display: flex;
            flex-wrap: wrap; 
            gap: 12px;
            margin-top: 15px; 
        }

        .skills-list span {
            font-size: 0.9rem;
            font-weight: 600;
            color: #e0e0e0;
            background: rgba(255, 255, 255, 0.05);
            padding: 8px 16px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(5px);
            transition: 0.3s;
            cursor: default;
            white-space: nowrap; 
        }

        .music-section {
            display: flex;
            flex-direction: column;
            transition: all 0.3s; 
        }

        .music-header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .playlist-toggle-btn {
            background: none;
            border: none;
            color: #888;
            font-size: 1.1rem;
            cursor: pointer;
            transition: color 0.3s;
            padding: 5px 0;
            outline: none;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .playlist-toggle-btn i {
            display: inline-block;
            transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .playlist-toggle-btn:hover {
            color: #fff;
        }

        .playlist-toggle-btn.collapsed-btn i {
            transform: rotate(180deg);
        }

        .track-title {
            font-size: 0.9rem;
            color: #ffffff; 
            margin-bottom: 10px;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            text-shadow: 0 2px 6px rgba(0,0,0,0.8); 
        }

        .player-controls {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 15px;
            color: #ffffff;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5));
        }

        .player-controls i {
            cursor: pointer;
            transition: all 0.2s;
            font-size: 1.15rem;
        }

        .player-controls i:hover {
            transform: scale(1.1);
            text-shadow: 0 0 10px rgba(255,255,255,0.6);
        }

        .progress-container {
            width: 100%;
            height: 6px;
            background: rgba(0, 0, 0, 0.3); 
            border-radius: 3px;
            margin-bottom: 10px;
            position: relative;
            cursor: pointer;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .progress-bar {
            position: absolute;
            top: 0;
            left: 0;
            height: 100%;
            width: 0%;
            background: #fff;
            border-radius: 3px;
            box-shadow: 0 0 10px rgba(255,255,255,0.8);
        }

        .time-volume-wrapper {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 5px; 
        }

        .time {
            font-size: 0.8rem;
            color: #ffffff;
            font-weight: 600;
            text-shadow: 0 1px 4px rgba(0,0,0,0.8);
        }

        .volume-container {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #ddd;
        }

        .volume-container i {
            font-size: 0.85rem;
            cursor: pointer;
            transition: 0.2s;
        }

        .volume-container i:hover {
            color: #fff;
            text-shadow: 0 0 5px rgba(255,255,255,0.6);
        }

        .volume-slider {
            -webkit-appearance: none;
            width: 65px;
            height: 4px;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 2px;
            outline: none;
            cursor: pointer;
        }

        .volume-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #fff;
            box-shadow: 0 0 5px rgba(255,255,255,0.8);
        }

        .playlist-wrapper {
            display: grid;
            grid-template-rows: 1fr; 
            transition: grid-template-rows 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .playlist-wrapper.collapsed {
            grid-template-rows: 0fr; 
        }

        .playlist-inner {
            overflow: hidden;
            opacity: 1;
            transform: translateY(0) scale(1);
            transform-origin: top;
            transition: opacity 0.4s ease, transform 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .playlist-wrapper.collapsed .playlist-inner {
            opacity: 0;
            transform: translateY(-15px) scale(0.98);
            pointer-events: none;
        }

        .search-box {
            width: 100%;
            padding: 8px 12px;
            background: rgba(0, 0, 0, 0.5); 
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            color: #fff;
            font-family: 'Inter', sans-serif;
            font-size: 0.8rem;
            margin-top: 10px; 
            margin-bottom: 10px;
            outline: none;
            transition: 0.3s;
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.3);
        }

        .search-box:focus {
            border-color: rgba(255, 255, 255, 0.5);
            background: rgba(0, 0, 0, 0.7);
        }

        .search-box::placeholder {
            color: #aaa;
        }

        .playlist-ui {
            list-style: none;
            max-height: 110px;
            overflow-y: auto;
            border-radius: 8px;
            background: rgba(0, 0, 0, 0.2);
            padding: 4px;
        }

        .playlist-ui li {
            padding: 8px 10px;
            font-size: 0.8rem;
            color: #e0e0e0;
            cursor: pointer;
            border-radius: 6px;
            transition: 0.2s;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-bottom: 2px;
            text-shadow: 0 1px 3px rgba(0,0,0,0.6); 
        }

        .playlist-ui li:hover {
            background: rgba(0, 0, 0, 0.5); 
            color: #fff;
        }

        .playlist-ui li.active {
            color: #4ade80; 
            font-weight: 600;
            background: rgba(74, 222, 128, 0.1);
            text-shadow: 0 1px 4px rgba(0,0,0,0.8);
        }

        @keyframes trackClick {
            0% { transform: scale(1); }
            50% { transform: scale(0.96); background: rgba(74, 222, 128, 0.3); }
            100% { transform: scale(1); }
        }

        .playlist-ui li.clicked-anim {
            animation: trackClick 0.3s ease-out;
        }

        .playlist-ui::-webkit-scrollbar { width: 4px; }
        .playlist-ui::-webkit-scrollbar-track { background: transparent; }
        .playlist-ui::-webkit-scrollbar-thumb { 
            background: rgba(255,255,255,0.3); 
            border-radius: 4px; 
        }

        .footer {
            margin-top: auto;
            font-size: 0.8rem;
            color: #888;
            font-weight: 500;
        }

        @media (max-width: 768px) {
            body { perspective: none; }
            .bg-blur { filter: blur(15px); }
            .wrapper {
                align-items: flex-start;
                padding: 30px 15px; 
            }
            .glass-card {
                flex-direction: column;
                padding: 30px 25px; 
                gap: 35px; 
                width: 100%;
                max-width: 450px; 
                border-radius: 24px;
                transform: none !important;
                margin: 0 auto;
            }
            .left-panel, .right-panel { width: 100%; transform: none; }
            .avatar { height: 200px; }
            .grid-content { grid-template-columns: 1fr; gap: 30px; }
            .header-top {
                margin-bottom: 20px;
                justify-content: center;
                text-align: center;
            }
            .skills-list { justify-content: flex-start; }
            .track-title { font-size: 0.85rem; }
        }
    </style>
</head>
<body>

    <div class="bg-blur"></div>
    <canvas id="rainCanvas"></canvas>

    <div class="wrapper">
        <div class="glass-card" id="tiltCard">
            <div class="left-panel">
                <div class="avatar">
                    <img src="avatar.png" alt="Avatar">
                </div>
                
                <div class="terminal">
                    <div class="term-header">
                        <span>host: archbox</span>
                        <span>uptime: 3d</span>
                    </div>
                    <div class="term-body">
                        <span>$ neofetch --ascii</span>
                    </div>
                </div>

                <div class="social">
                    <a href="https://steamcommunity.com/id/xfgh2/" target="_blank"><i class="fa-brands fa-steam"></i> Steam</a>
                </div>
            </div>

            <div class="right-panel">
                <div class="header-top">
                    <div class="name-wrapper">
                        <h1>xfgh2</h1><span>• bio</span>
                    </div>
                </div>

                <div class="grid-content">
                    <div class="skills-section">
                        <div class="section-title">
                            <i class="fa-solid fa-code"></i> НАВЫКИ
                        </div>
                        <div class="skills-list">
                            <span>Python</span>
                            <span>C++</span>
                        </div>
                    </div>

                    <div class="music-section" id="musicSection">
                        <div class="music-header-row">
                            <div class="section-title">
                                <i class="fa-solid fa-music"></i> МУЗЫКА
                            </div>
                            <button id="togglePlaylistBtn" class="playlist-toggle-btn">
                                <i class="fa-solid fa-chevron-up"></i>
                            </button>
                        </div>
                        
                        <div class="track-title" id="trackTitle">Загрузка...</div>
                        
                        <div class="player-controls">
                            <i class="fa-solid fa-backward-step" id="prevBtn"></i>
                            <i class="fa-solid fa-play" id="playBtn"></i>
                            <i class="fa-solid fa-forward-step" id="nextBtn"></i>
                            <i class="fa-solid fa-repeat" id="loopBtn" style="opacity: 0.5;"></i>
                        </div>
                        
                        <div class="progress-container" id="progressContainer">
                            <div class="progress-bar" id="progressBar"></div>
                        </div>
                        
                        <div class="time-volume-wrapper">
                            <div class="time" id="timeDisplay">00:00 / 00:00</div>
                            <div class="volume-container">
                                <i class="fa-solid fa-volume-low" id="muteBtn"></i>
                                <input type="range" id="volumeSlider" class="volume-slider" min="0" max="1" step="0.01" value="0.33">
                            </div>
                        </div>

                        <div class="playlist-wrapper" id="playlistWrapper">
                            <div class="playlist-inner">
                                <input type="text" id="searchInput" class="search-box" placeholder="Поиск по трекам...">
                                <ul class="playlist-ui" id="playlistUI">
                                </ul>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="footer">
                    © 2026 xfgh2 • Все права защищены
                </div>
            </div>
        </div>
    </div>

    <script>
        // --- ОБЪЕДИНЕННЫЙ ЭФФЕКТ ДОЖДЯ И САКУРЫ ---
        const canvas = document.getElementById('rainCanvas');
        const ctx = canvas.getContext('2d');
        
        function resizeCanvas() { 
            canvas.width = window.innerWidth; 
            canvas.height = window.innerHeight; 
        }
        resizeCanvas(); 
        window.addEventListener('resize', resizeCanvas);
        
        // Генерация капель дождя
        const raindrops = [];
        for (let i = 0; i < 450; i++) {
            raindrops.push({
                x: Math.random() * canvas.width, 
                y: Math.random() * canvas.height,
                length: Math.random() * 25 + 15, 
                speed: Math.random() * 12 + 9, 
                opacity: Math.random() * 0.4 + 0.15 
            });
        }

        // Генерация листьев сакуры (30 штук)
        const leaves = [];
        const leavesCount = 30;
        for (let i = 0; i < leavesCount; i++) {
            leaves.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                size: Math.random() * 4 + 2,     // Размер лепестка
                speed: Math.random() * 1.5 + 0.5,  // Скорость падения (медленнее дождя)
                wobble: Math.random() * 2,       // Сила покачивания
                angle: Math.random() * Math.PI * 2, // Начальный угол поворота
                opacity: Math.random() * 0.5 + 0.3 // Прозрачность
            });
        }

        function drawBackground() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // 1. Рисуем дождь
            ctx.lineCap = 'round';
            for (let i = 0; i < raindrops.length; i++) {
                const drop = raindrops[i];
                ctx.beginPath(); 
                ctx.moveTo(drop.x, drop.y); 
                ctx.lineTo(drop.x + drop.length * 0.12, drop.y + drop.length);
                ctx.strokeStyle = `rgba(255, 255, 255, ${drop.opacity})`; 
                ctx.lineWidth = 1.2; 
                ctx.stroke();
                
                drop.y += drop.speed; 
                drop.x += drop.speed * 0.12;
                
                if (drop.y > canvas.height) { 
                    drop.y = -drop.length; 
                    drop.x = Math.random() * canvas.width; 
                }
            }

            // 2. Рисуем сакуру
            for (let i = 0; i < leaves.length; i++) {
                const leaf = leaves[i];
                ctx.beginPath();
                // Рисуем овал (лепесток), который может вращаться
                ctx.ellipse(leaf.x, leaf.y, leaf.size, leaf.size * 0.6, leaf.angle, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(255, 183, 197, ${leaf.opacity})`; // Нежно-розовый цвет
                ctx.fill();

                leaf.y += leaf.speed;
                // Лепесток плавно покачивается влево-вправо с помощью синусоиды
                leaf.x += Math.sin(leaf.y / 30) * leaf.wobble;
                leaf.angle += 0.02; // Медленно вращаем лепесток

                if (leaf.y > canvas.height + 10) {
                    leaf.y = -leaf.size;
                    leaf.x = Math.random() * canvas.width;
                }
            }

            requestAnimationFrame(drawBackground);
        }
        drawBackground();

        // --- 3D НАКЛОН ---
        const card = document.getElementById('tiltCard');
        const musicSection = document.getElementById('musicSection');
        let isOverMusic = false;

        musicSection.addEventListener('mouseenter', () => {
            isOverMusic = true;
            card.classList.add('disable-glass-hover'); 
            card.style.transition = 'all 0.5s cubic-bezier(0.25, 0.8, 0.25, 1)';
            card.style.transform = `perspective(1000px) rotateX(0deg) rotateY(0deg) scale(1)`; 
        });

        musicSection.addEventListener('mouseleave', () => {
            isOverMusic = false;
            card.classList.remove('disable-glass-hover'); 
        });

        if (window.matchMedia("(min-width: 769px)").matches) {
            card.addEventListener('mousemove', (e) => {
                if (isOverMusic) return; 
                const rect = card.getBoundingClientRect();
                const rotateX = (((e.clientY - rect.top) - rect.height / 2) / (rect.height / 2)) * -4; 
                const rotateY = (((e.clientX - rect.left) - rect.width / 2) / (rect.width / 2)) * 4;
                card.style.transition = 'none';
                card.style.transform = `perspective(1000px) rotateX(${rotateX}deg) rotateY(${rotateY}deg) scale(1.01)`;
            });
            card.addEventListener('mouseleave', () => {
                if (isOverMusic) return;
                card.style.transition = 'all 0.5s cubic-bezier(0.25, 0.8, 0.25, 1)';
                card.style.transform = `perspective(1000px) rotateX(0deg) rotateY(0deg) scale(1)`;
            });
        }

        // --- КНОПКА СКРЫТИЯ ПЛЕЙЛИСТА ---
        const togglePlaylistBtn = document.getElementById('togglePlaylistBtn');
        const playlistWrapper = document.getElementById('playlistWrapper');

        togglePlaylistBtn.addEventListener('click', () => {
            playlistWrapper.classList.toggle('collapsed');
            togglePlaylistBtn.classList.toggle('collapsed-btn');
        });

        // --- ПЛЕЙЛИСТ ---
        const playlist = [
            { title: "ivycraft - Люблю москву но снится London", src: "track1.mp3" },
            { title: "парапустяков, coldn1ght – чары", src: "track2.mp3" },
            { title: "volhey – мило материшься", src: "track3.mp3" },
            { title: "volhey, fallen777angel – лицемер", src: "track4.mp3" },
            { title: "madk1d,greyrock, tewiq – MARTIN ROSE", src: "track5.mp3" },
            { title: "dabbackwood – не попался", src: "track6.mp3" },
            { title: "ТРОЕТОЧИЕ – КРАСНЫЙ ФЛАГ", src: "track7.mp3" },
            { title: "MORGENSHTERN – ПОВОД", src: "track8.mp3" },
            { title: "Whybaby_ff_ironmouse_ – _Cry_For_Me_WA_WA_WA", src: "track9.mp3" },
            { title: "laydownrot – Look me in my hunter eyes", src: "track10.mp3" }
        ];

        let currentTrackIndex = 0;
        let isPlaying = false;
        let isLooping = false;
        let fadeInterval;

        const audio = new Audio();
        audio.volume = 0.33; 

        const playBtn = document.getElementById('playBtn');
        const trackTitle = document.getElementById('trackTitle');
        const progressBar = document.getElementById('progressBar');
        const timeDisplay = document.getElementById('timeDisplay');
        const playlistUI = document.getElementById('playlistUI');
        const searchInput = document.getElementById('searchInput');
        const volumeSlider = document.getElementById('volumeSlider');
        const muteBtn = document.getElementById('muteBtn');

        function renderPlaylist(filterText = '') {
            playlistUI.innerHTML = '';
            
            const activeElements = [];
            const otherElements = [];

            playlist.forEach((track, index) => {
                if (track.title.toLowerCase().includes(filterText.toLowerCase())) {
                    const li = document.createElement('li');
                    li.textContent = track.title;
                    
                    li.addEventListener('click', () => {
                        li.classList.add('clicked-anim');
                        setTimeout(() => li.classList.remove('clicked-anim'), 300);
                        switchTrackSmoothly(index);
                    });

                    if (index === currentTrackIndex) {
                        li.classList.add('active');
                        activeElements.push(li);
                    } else {
                        otherElements.push(li);
                    }
                }
            });

            activeElements.forEach(li => playlistUI.appendChild(li));
            otherElements.forEach(li => playlistUI.appendChild(li));
            
            playlistUI.scrollTop = 0;
        }

        function loadTrack(index) {
            currentTrackIndex = index;
            audio.src = playlist[index].src;
            trackTitle.textContent = playlist[index].title;
            progressBar.style.width = '0%';
            renderPlaylist(searchInput.value); 
        }

        function switchTrackSmoothly(index) {
            clearInterval(fadeInterval); 
            
            if (!isPlaying || parseFloat(volumeSlider.value) === 0) {
                loadTrack(index);
                audio.play();
                isPlaying = true;
                playBtn.className = 'fa-solid fa-pause';
                audio.volume = parseFloat(volumeSlider.value);
                return;
            }

            const targetVolume = parseFloat(volumeSlider.value);
            const steps = 15; 
            const stepTime = 20; 
            const fadeOutStep = audio.volume / steps;

            fadeInterval = setInterval(() => {
                if (audio.volume - fadeOutStep > 0.01) {
                    audio.volume -= fadeOutStep;
                } else {
                    audio.volume = 0;
                    clearInterval(fadeInterval);
                    
                    loadTrack(index);
                    audio.play();
                    isPlaying = true;
                    playBtn.className = 'fa-solid fa-pause';

                    const fadeInStep = targetVolume / steps;
                    fadeInterval = setInterval(() => {
                        if (audio.volume + fadeInStep < targetVolume) {
                            audio.volume += fadeInStep;
                        } else {
                            audio.volume = targetVolume;
                            clearInterval(fadeInterval);
                        }
                    }, stepTime);
                }
            }, stepTime);
        }

        function togglePlay() {
            if (isPlaying) { 
                audio.pause(); 
                playBtn.className = 'fa-solid fa-play'; 
            } else { 
                audio.play().catch(e => console.log("Взаимодействуйте со страницей")); 
                playBtn.className = 'fa-solid fa-pause'; 
            }
            isPlaying = !isPlaying;
        }

        document.getElementById('nextBtn').addEventListener('click', () => {
            let index = currentTrackIndex + 1;
            if (index >= playlist.length) index = 0;
            switchTrackSmoothly(index);
        });

        document.getElementById('prevBtn').addEventListener('click', () => {
            let index = currentTrackIndex - 1;
            if (index < 0) index = playlist.length - 1;
            switchTrackSmoothly(index);
        });

        document.getElementById('loopBtn').addEventListener('click', (e) => {
            isLooping = !isLooping;
            e.target.style.opacity = isLooping ? '1' : '0.5';
        });

        playBtn.addEventListener('click', togglePlay);

        searchInput.addEventListener('input', (e) => {
            renderPlaylist(e.target.value);
        });

        audio.addEventListener('timeupdate', () => {
            if (audio.duration) {
                progressBar.style.width = `${(audio.currentTime / audio.duration) * 100}%`;
                
                let curMins = Math.floor(audio.currentTime / 60);
                let curSecs = Math.floor(audio.currentTime % 60);
                let durMins = Math.floor(audio.duration / 60);
                let durSecs = Math.floor(audio.duration % 60);
                
                timeDisplay.textContent = `${curMins < 10 ? '0':''}${curMins}:${curSecs < 10 ? '0':''}${curSecs} / ${durMins < 10 ? '0':''}${durMins}:${durSecs < 10 ? '0':''}${durSecs}`;
            }
        });

        document.getElementById('progressContainer').addEventListener('click', (e) => {
            if (audio.duration) audio.currentTime = (e.offsetX / e.target.clientWidth) * audio.duration;
        });

        audio.addEventListener('ended', () => {
            if (isLooping) { 
                audio.currentTime = 0; 
                audio.play(); 
            } else { 
                let index = currentTrackIndex + 1;
                if (index >= playlist.length) index = 0;
                switchTrackSmoothly(index); 
            }
        });

        function updateVolumeIcon(vol) {
            if (vol == 0) muteBtn.className = 'fa-solid fa-volume-xmark';
            else if (vol < 0.5) muteBtn.className = 'fa-solid fa-volume-low';
            else muteBtn.className = 'fa-solid fa-volume-high';
        }

        volumeSlider.addEventListener('input', (e) => {
            audio.volume = e.target.value;
            clearInterval(fadeInterval); 
            updateVolumeIcon(audio.volume);
        });

        muteBtn.addEventListener('click', () => {
            clearInterval(fadeInterval);
            if (audio.volume > 0) {
                audio.dataset.savedVolume = audio.volume; 
                audio.volume = 0;
                volumeSlider.value = 0;
            } else {
                audio.volume = audio.dataset.savedVolume || 0.33; 
                volumeSlider.value = audio.volume;
            }
            updateVolumeIcon(audio.volume);
        });

        loadTrack(0);
        renderPlaylist();
    </script>
</body>
</html>
